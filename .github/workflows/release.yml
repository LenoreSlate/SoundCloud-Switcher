name: Release

# git tag v1.3.0 && git push origin v1.3.0  ->  tests, zip, GitHub Release
on:
  push:
    tags: ["v*"]

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Le tag correspond à la version du manifest
        run: |
          version="v$(node -p 'require("./manifest.json").version')"
          [ "$version" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME != manifest $version"; exit 1; }
      - run: npm run build
      - name: Zip de l'extension
        run: zip -r "soundcloud-switcher-$GITHUB_REF_NAME.zip" manifest.json popup.html popup.css icons _locales dist LICENSE
      - name: GitHub Release
        run: gh release create "$GITHUB_REF_NAME" soundcloud-switcher-*.zip --title "SoundCloud Switcher $GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
